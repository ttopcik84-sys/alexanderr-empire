<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="How Alexander the Great conquered the whole world — an illustrated journey through his conquests.">
  <title>How Alexander the Great Conquered the Whole World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="#top" aria-label="Back to the beginning">
        <img src="assets/macedonian-sun.png" width="800" height="533" alt="Macedonian sun">
      </a>
      <nav aria-label="Chapters">
        <button type="button"><span>I.</span> Before the Conquest</button>
        <button type="button"><span>II.</span> The Great Conquest</button>
        <button type="button"><span>III.</span> Beyond Persia</button>
      </nav>
    </header>
    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="ornament" aria-hidden="true"><i></i><span>✦</span><i></i></div>
        <h1 id="hero-title">How Alexander<br>the Great conquered<br><em>the whole world.</em></h1>
        <div class="gallery">
          <figure class="mosaic"><img src="assets/alexander-mosaic.jpg" width="643" height="427" alt="Ancient mosaic depicting Alexander the Great on horseback"></figure>
          <div class="gallery-divider" aria-hidden="true"><span>✦</span></div>
          <figure class="map"><img src="assets/empire-map.jpg" width="608" height="450" alt="Illustrated map of Alexander the Great’s empire at its greatest extent"></figure>
        </div>
        <div class="end-rule" aria-hidden="true"><span>◆</span></div>
      </section>
    </main>
  </div>
</body>
</html>
